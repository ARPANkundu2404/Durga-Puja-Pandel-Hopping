spring.application.name=durga_puja_hopping

spring.profiles.active=DEV

jwt.secret=${JWT_SECRET}

#Database
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Turn Statistics on
logging.level.org.hibernate.stat=debug
logging.level.org.hibernate.type=trace

# Logger configuration
# Log file name (relative path to the current directory or an absolute path)
#logging.file.name=C:/Users/user/logs/durgaPujaHopping/app.log
# The logging level for the root logger (can be TRACE, DEBUG, INFO, WARN, ERROR)
logging.level.root=INFO
# Pattern for the log entries (optional)
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
# Limit the size of each log file (optional)
logging.file.max-size=10MB
# Keep a certain number of archived log files (optional)
logging.file.max-history=30
# Specify whether to roll over logs when the application restarts (optional)
logging.file.total-size-cap=100MB

#Mailer
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

#Admin secret code
APP_ADMIN_SECRET=${APP_ADMIN_SECRET}
